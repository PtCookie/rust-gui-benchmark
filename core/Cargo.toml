[package]
name = "bench-core"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "core-bench"
path = "src/bin/core_bench.rs"

[dependencies]
git2 = { version = "0.21.0", default-features = false }
gix = { version = "0.88.0", default-features = false, features = ["revision", "max-performance-safe", "sha1"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
