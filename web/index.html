<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>bench</title>
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #d4d4d4; font: 13px/20px system-ui, sans-serif; overflow: hidden; }
  #wrap { position: absolute; inset: 0; overflow-y: scroll; }
  #layer { position: fixed; left: 0; top: 0; right: 16px; bottom: 0; overflow: hidden; pointer-events: none; }
  #g { position: absolute; left: 0; top: 0; }
  .row { position: absolute; left: 0; right: 0; height: 20px; white-space: nowrap; will-change: transform; }
  .row span { position: absolute; top: 0; height: 20px; overflow: hidden; text-overflow: ellipsis; }
  .row:nth-child(even) { background: rgba(255,255,255,0.03); }
  .dim { color: #8a8a8a; }
</style>
</head>
<body>
<div id="wrap"><div id="spacer"></div></div>
<div id="layer"><canvas id="g"></canvas></div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
